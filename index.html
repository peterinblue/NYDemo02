<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NYDemo02 · Hello World</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #fff;
    }
    .card {
      text-align: center;
      padding: 48px 56px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(6px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
    }
    h1 {
      font-size: 56px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }
    p {
      font-size: 16px;
      opacity: 0.85;
    }
    .tag {
      display: inline-block;
      margin-top: 20px;
      padding: 6px 14px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 999px;
      font-size: 13px;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello World</h1>
    <p>NYDemo02 · GitHub Pages</p>
    <span class="tag">peterinblue.github.io/NYDemo02</span>
  </div>
</body>
</html>
